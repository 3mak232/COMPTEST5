<script>
/* theme: explicit choice wins, otherwise follow the OS (set before first paint) */
try{var __t=localStorage.getItem('fedo-theme');if(__t==='dark'||__t==='light')document.documentElement.dataset.theme=__t}catch(e){}
function fedoCurrentTheme(){var d=document.documentElement.dataset.theme;if(d)return d;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function fedoThemeIcon(t){return t==='dark'
 ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
 :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'}
function fedoThemeBtn(cls){var t=fedoCurrentTheme();return '<button type="button" class="'+cls+'" onclick="fedoToggleTheme()" aria-label="تبديل الوضع الفاتح والداكن" title="الوضع الداكن / الفاتح">'+fedoThemeIcon(t)+'</button>'}
function fedoToggleTheme(){var n=fedoCurrentTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('fedo-theme',n)}catch(e){}document.querySelectorAll('.theme-btn').forEach(function(b){b.innerHTML=fedoThemeIcon(n)})}
</script>
